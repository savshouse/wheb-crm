<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WHEB CRM</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Header -->
  <div class="header">
    <button id="btn-back" class="back-btn hidden" title="Back to tasks">← Back</button>
    <span class="header-title">WHEB CRM</span>
    <a id="open-crm" href="https://wheb-crm.vercel.app" target="_blank" class="open-link" title="Open in CRM">Open ↗</a>
  </div>

  <!-- Loading -->
  <div id="loading" class="center-state hidden">
    <div class="spinner"></div>
  </div>

  <!-- Task detail -->
  <div id="detail" class="hidden">
    <div class="task-header">
      <div class="meta-row">
        <span id="priority-badge" class="badge"></span>
        <span id="status-badge" class="badge"></span>
        <span id="due-badge" class="due"></span>
      </div>
      <h1 id="task-title" class="task-title"></h1>
      <div id="client-row" class="client-row hidden">
        <span class="label-sm">Client</span>
        <a id="client-link" href="#" target="_blank" class="client-name"></a>
      </div>
      <div id="assignee-row" class="assignee-row hidden">
        <span class="label-sm">Assigned to</span>
        <span id="assignee-name" class="assignee-name"></span>
      </div>
      <div id="meeting-row" class="assignee-row hidden">
        <span class="label-sm">Meeting</span>
        <a id="meeting-link" href="#" target="_blank" class="client-name"></a>
      </div>
      <div id="actions" class="actions"></div>
    </div>

    <!-- Notes -->
    <div id="description-section" class="section">
      <div class="section-header">
        <div class="section-label">Notes</div>
        <button id="notes-edit-btn" class="edit-icon-btn" title="Edit notes">✏</button>
      </div>
      <p id="description" class="description empty-hint">No notes — click ✏ to add</p>
      <div id="notes-edit" class="notes-edit hidden">
        <textarea id="notes-textarea" rows="4" placeholder="Add notes…"></textarea>
        <div class="notes-actions">
          <button id="notes-save" class="btn-save">Save</button>
          <button id="notes-cancel" class="btn-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Sub-tasks -->
    <div id="subtasks-section" class="section hidden">
      <div class="section-label">Sub-tasks</div>
      <div id="subtask-list"></div>
    </div>

    <!-- Comments -->
    <div id="comments-section" class="section">
      <div class="section-label">Comments</div>
      <div class="comment-input-area">
        <textarea id="comment-input" rows="2" placeholder="Leave a comment… (Ctrl+Enter to send)"></textarea>
        <button id="comment-submit" class="btn-submit">Add</button>
      </div>
      <div id="comment-list" class="comment-list"></div>
    </div>
  </div>

  <!-- Home screen (task list) -->
  <div id="task-list-view">

    <!-- Not logged in -->
    <div id="tl-not-logged-in" class="center-state hidden">
      <div class="empty-icon">🔒</div>
      <p class="hint">Log in to WHEB CRM to see your tasks</p>
      <a href="https://wheb-crm.vercel.app/auth/login" target="_blank" class="btn-outline">Log in ↗</a>
      <button id="tl-retry" class="btn-outline" style="margin-top:6px">Retry</button>
    </div>

    <!-- Loading -->
    <div id="task-list-loading" class="center-state">
      <div class="spinner"></div>
    </div>

    <!-- Error -->
    <div id="task-list-error" class="center-state hidden">
      <p class="hint">Could not load tasks.</p>
      <a href="https://wheb-crm.vercel.app/auth/login" target="_blank" class="btn-outline">Log in ↗</a>
      <button id="tl-retry-err" class="btn-outline" style="margin-top:6px">Retry</button>
    </div>

    <!-- Content -->
    <div id="task-list-content" class="hidden">

      <!-- User name + open CRM -->
      <div class="tl-header">
        <span id="tl-user-name" class="tl-title"></span>
        <a href="https://wheb-crm.vercel.app/tasks" target="_blank" class="open-link">Open ↗</a>
      </div>

      <!-- Stats -->
      <div class="tl-stats-row" id="tl-stats">
        <div class="tl-stat tl-stat-red">
          <div class="tl-stat-num" id="tl-stat-overdue">0</div>
          <div class="tl-stat-label">Overdue</div>
        </div>
        <div class="tl-stat tl-stat-amber">
          <div class="tl-stat-num" id="tl-stat-today">0</div>
          <div class="tl-stat-label">Due today</div>
        </div>
        <div class="tl-stat tl-stat-blue">
          <div class="tl-stat-num" id="tl-stat-open">0</div>
          <div class="tl-stat-label">Open</div>
        </div>
      </div>

      <!-- Quick links -->
      <div class="tl-quick-links">
        <a href="https://wheb-crm.vercel.app/clients" target="_blank" class="tl-quick-link">Clients</a>
        <a href="https://wheb-crm.vercel.app/meetings" target="_blank" class="tl-quick-link">Meetings</a>
        <a href="https://wheb-crm.vercel.app/reports" target="_blank" class="tl-quick-link">Reports</a>
      </div>

      <!-- Task list -->
      <div class="section-label" style="padding: 10px 16px 4px;">Your tasks</div>
      <div id="tl-items"></div>

      <div id="tl-empty" class="center-state hidden">
        <p class="hint">No open tasks assigned to you.</p>
      </div>

    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
